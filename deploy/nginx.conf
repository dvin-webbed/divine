# Replace bluepips.example with your real domain everywhere in this file.

# ---- Plain HTTP: redirect everything to HTTPS, except the ACME challenge path ----
server {
    listen 80;
    server_name bluepips.example www.bluepips.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: terminate TLS here, proxy everything to the Node app ----
server {
    listen 443 ssl http2;
    server_name bluepips.example www.bluepips.example;

    ssl_certificate     /etc/letsencrypt/live/bluepips.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bluepips.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Belt-and-suspenders alongside the app's own Helmet headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 200k;

    # Long-cache static assets - filenames should change (hashed) when content changes
    location /assets/ {
        proxy_pass http://app:4000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
