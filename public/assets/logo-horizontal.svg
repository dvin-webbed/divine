<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&amp;family=Inter:wght@600;700&amp;display=swap');
      .bp-word{ font-family:'Fraunces', Georgia, serif; font-weight:600; }
      .bp-tag{ font-family:'Inter', Arial, sans-serif; font-weight:700; letter-spacing:.14em; }
    </style>
    <linearGradient id="barGold2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9C7C1D"/>
      <stop offset="1" stop-color="#E4C455"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(4,4)">
    <rect x="1" y="1" width="62" height="62" rx="14" fill="#0B0B0C" stroke="#4A1420" stroke-width="1.5"/>
    <rect x="15" y="34" width="7" height="17" rx="1.5" fill="#8C7A2E"/>
    <rect x="26.5" y="26" width="7" height="25" rx="1.5" fill="#C9A227"/>
    <rect x="38" y="15" width="7" height="36" rx="1.5" fill="url(#barGold2)"/>
    <polyline points="18.5,32 30,24 41.5,13" fill="none" stroke="#E4C455" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
    <circle cx="41.5" cy="13" r="3.4" fill="#0B0B0C" stroke="#E4C455" stroke-width="1.6"/>
  </g>

  <!-- wordmark -->
  <text x="82" y="38" class="bp-word" font-size="27" fill="#FCFAF5">BLUE <tspan fill="#C9A227" font-style="italic">PIPS</tspan></text>
  <text x="83" y="55" class="bp-tag" font-size="10.5" fill="#8C8A85">INVESTMENT</text>
</svg>
