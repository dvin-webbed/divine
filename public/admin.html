<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Monitoring — Blue Pips Investment</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  body{ background:var(--ink); }
  .admin-wrap{ max-width:1100px; margin:0 auto; padding:50px 28px 90px; }
  .admin-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:34px; flex-wrap:wrap; gap:14px; }
  .admin-head h1{ font-family:var(--font-display); font-size:32px; color:var(--white); }
  .key-form{ display:flex; gap:8px; }
  .key-form input{ padding:10px 12px; background:rgba(255,255,255,.04); border:1px solid rgba(243,238,227,.2); border-radius:4px; color:var(--white); font-size:13px; width:220px; }
  .kpi-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:36px; }
  .kpi{ background:var(--ink-soft); border:1px solid rgba(243,238,227,.08); border-radius:6px; padding:22px; }
  .kpi .n{ font-family:var(--font-display); font-size:36px; color:var(--gold); }
  .kpi .l{ font-size:12.5px; color:var(--steel); margin-top:6px; }
  .panel-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:24px; }
  .panel{ background:var(--ink-soft); border:1px solid rgba(243,238,227,.08); border-radius:6px; padding:24px; }
  .panel h3{ font-family:var(--font-display); font-size:16px; color:var(--white); margin-bottom:16px; }
  table{ width:100%; border-collapse:collapse; }
  th, td{ text-align:left; padding:9px 6px; font-size:13px; border-bottom:1px solid rgba(243,238,227,.08); }
  th{ color:var(--gold); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  td{ color:rgba(243,238,227,.78); }
  .empty{ font-size:13px; color:var(--steel); padding:14px 0; }
  .status{ font-size:13px; color:var(--steel); margin-top:6px; }
  .mini-bars{ display:flex; align-items:flex-end; gap:4px; height:120px; margin-top:6px; }
  .mini-bar{ flex:1; background:var(--gold); border-radius:2px 2px 0 0; min-height:3px; position:relative; }
  .mini-bar em{ position:absolute; bottom:-18px; left:0; right:0; text-align:center; font-size:9px; color:var(--steel); font-style:normal; }
</style>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-head">
      <div>
        <span class="tag-label">Internal — not linked from the public site</span>
        <h1>Site monitoring</h1>
      </div>
      <div>
        <div class="key-form">
          <input type="password" id="admin-key" placeholder="Admin key (see .env ADMIN_KEY)">
          <button class="btn btn-gold" id="load-btn">Load</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div id="dashboard" style="display:none;">
      <div class="kpi-grid">
        <div class="kpi"><div class="n" id="kpi-views">–</div><div class="l">total page views</div></div>
        <div class="kpi"><div class="n" id="kpi-users">–</div><div class="l">registered accounts</div></div>
      </div>

      <div class="panel" style="margin-bottom:24px;">
        <h3>Page views — last 14 days</h3>
        <div class="mini-bars" id="views-by-day"></div>
      </div>

      <div class="panel-grid">
        <div class="panel">
          <h3>Top pages</h3>
          <table>
            <thead><tr><th>Path</th><th>Views</th></tr></thead>
            <tbody id="top-pages"></tbody>
          </table>
        </div>
        <div class="panel">
          <h3>Top events</h3>
          <table>
            <thead><tr><th>Event</th><th>Count</th></tr></thead>
            <tbody id="top-events"></tbody>
          </table>
        </div>
        <div class="panel">
          <h3>Recent signups</h3>
          <table>
            <thead><tr><th>Name</th><th>Goal</th><th>When</th></tr></thead>
            <tbody id="recent-signups"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script src="assets/admin.js"></script>
</body>
</html>
