<section class="onboard" style="padding-top:70px;">
  <div class="wrap" style="max-width:460px;">
    <div class="onboard-form reveal" style="border:1px solid rgba(243,238,227,.1); border-radius:8px;">
      <span class="tag-label">Welcome back</span>
      <h3 style="font-family:var(--font-display); font-size:24px; color:var(--white); margin:10px 0 26px;">Log in to your account</h3>

      <div id="login-error" style="display:none; background:rgba(74,20,32,.35); border:1px solid var(--oxblood-bright); color:var(--parchment); padding:12px 14px; border-radius:4px; font-size:13px; margin-bottom:18px;"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-identifier">Email or phone number</label>
          <input type="text" id="login-identifier" placeholder="you@email.com or +15551234567" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-gold btn-block" type="submit" id="login-submit">Log in</button>
      </form>

      <p style="font-size:13px; color:var(--steel); margin-top:18px; text-align:center;">
        Don't have an account? <a href="get-started.html" style="color:var(--gold);">Get started</a>
      </p>
    </div>
  </div>
