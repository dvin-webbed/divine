services:
  mysql:
    image: mysql:8.4
    container_name: bluepips-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bluepips}
      MYSQL_USER: ${DB_USER:-bluepips}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - bluepips_mysql_data:/var/lib/mysql
    networks:
      - internal
    # No host port mapping here on purpose — only the app container talks to MySQL.
    # Expose 3306 only if you need to connect a DB client directly for admin work.

  app:
    build: .
    container_name: bluepips-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      NODE_ENV: production
    depends_on:
      - mysql
    networks:
      - internal
    # Not published to the host - Nginx is the only public entry point.

  nginx:
    image: nginx:alpine
    container_name: bluepips-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - internal

  # Run once (or on a cron) to issue/renew a Let's Encrypt certificate.
  # See README "TLS / HTTPS" section for the exact command.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - internal

networks:
  internal:

volumes:
  bluepips_mysql_data:
  certbot_www:
  certbot_certs:
